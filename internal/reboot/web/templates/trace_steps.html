{{define "trace-steps"}}
        <g class="trace-steps"{{if gt .Opacity 0.0}} opacity="{{printf "%.2f" .Opacity}}"{{end}}>
          {{range .Steps}}
          {{if or (eq .Op "turn") (eq .Op "face")}}
          {{if .Path}}
          <path data-step-id="{{.ID}}" data-op="{{.Op}}" d="{{.Path}}" fill="none" stroke="{{if eq .Op "face"}}#0550ae{{else}}#6f42c1{{end}}" stroke-width="{{printf "%.1f" $.ArcWidth}}"{{if $.UseMarkers}} marker-end="url(#turn-arrow)"{{end}}/>
          {{else}}
          <circle data-step-id="{{.ID}}" data-op="{{.Op}}" cx="{{printf "%.2f" .X1}}" cy="{{printf "%.2f" .Y1}}" r="{{printf "%.1f" $.ZeroArcRadius}}" fill="none" stroke="{{if eq .Op "face"}}#0550ae{{else}}#6f42c1{{end}}" stroke-width="{{printf "%.1f" $.ArcWidth}}" stroke-dasharray="2 2"/>
          {{end}}
          {{else}}
          <line data-step-id="{{.ID}}" data-op="{{.Op}}" x1="{{printf "%.2f" .X1}}" y1="{{printf "%.2f" .Y1}}" x2="{{printf "%.2f" .X2}}" y2="{{printf "%.2f" .Y2}}" stroke="{{if eq .Op "translate"}}#1a7f37{{else}}#b35900{{end}}" stroke-width="{{printf "%.1f" $.LineWidth}}"{{if $.DashArray}} stroke-dasharray="{{$.DashArray}}"{{end}}{{if $.UseMarkers}} marker-end="url(#arrow)"{{end}}/>
          {{end}}
          {{end}}
        </g>
{{end}}
{{define "step-frame-defs"}}
          <marker id="axis-x-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#cf222e"/>
          </marker>
          <marker id="axis-y-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#1a7f37"/>
          </marker>
{{end}}
{{define "step-frames"}}
        <g class="step-frames" aria-hidden="true">
          {{range .Steps}}
          <g class="step-frame" data-step-frame="{{.ID}}">
            <line data-axis="x" x1="{{printf "%.2f" .X2}}" y1="{{printf "%.2f" .Y2}}" x2="{{printf "%.2f" .AxisXEnd.X}}" y2="{{printf "%.2f" .AxisXEnd.Y}}" stroke="#cf222e" stroke-width="{{printf "%.1f" $.AxisWidth}}" marker-end="url(#axis-x-arrow)"/>
            <line data-axis="y" x1="{{printf "%.2f" .X2}}" y1="{{printf "%.2f" .Y2}}" x2="{{printf "%.2f" .AxisYEnd.X}}" y2="{{printf "%.2f" .AxisYEnd.Y}}" stroke="#1a7f37" stroke-width="{{printf "%.1f" $.AxisWidth}}" marker-end="url(#axis-y-arrow)"/>
            <circle data-axis="origin" cx="{{printf "%.2f" .X2}}" cy="{{printf "%.2f" .Y2}}" r="{{printf "%.1f" $.OriginRadius}}" fill="none" stroke="#cf222e" stroke-width="{{printf "%.1f" $.AxisWidth}}"/>
            <text class="axis-label" x="{{printf "%.2f" .AxisXLabel.X}}" y="{{printf "%.2f" .AxisXLabel.Y}}" fill="#cf222e" font-size="{{printf "%.1f" $.AxisFontSize}}" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, monospace">+X</text>
            <text class="axis-label" x="{{printf "%.2f" .AxisYLabel.X}}" y="{{printf "%.2f" .AxisYLabel.Y}}" fill="#1a7f37" font-size="{{printf "%.1f" $.AxisFontSize}}" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, monospace">+Y</text>
          </g>
          {{end}}
        </g>
{{end}}
