metadata:
  scope: "Threadless 1-1/8 in steerer bicycle stems rated for XC / trail use (ISO 4210-MTB / ASTM Category 3, non-gravity)"
  bar_clamp_standards_covered_mm: [31.8, 35.0]
  length_range_mm:
    min: 40
    max: 120
    step: 10
  angle_notation:
    reversible: "'+/-X' indicates flip-flop mounting for +X deg rise or -X deg drop"
    fixed_negative: "'-X' indicates dedicated negative-rise (drop) XC race stem"
    zero: "0 indicates neutral 0 deg angle (perpendicular to steerer tube)"
  availability_scale:
    - abundant: "Wide selection across dedicated trail and XC product lines"
    - common: "Broadly stocked across XC and dual-purpose road/MTB lines"
    - limited: "Most modern trail/enduro lines stop at 60-90 mm; primarily legacy XC and dual-rated alloy lines"
    - sparse: "Small subset of dedicated MTB/XC models plus dual-rated road/XC alloy stems"
  notes:
    - "Dedicated trail/all-mountain lines (e.g., Race Face Turbine R, Salsa Guide Trail, PRO Koryak, Industry Nine A318) typically terminate at 50-70 mm."
    - "Dedicated XC/trail models extending to 110-120 mm (e.g., Thomson Elite X4, Race Face Ride XC, FSA Afterburner, FSA NS Drop) are supplemented by dual-rated road/XC alloy stems (e.g., Easton EA90 SL, Easton EA50, Ritchey WCS C220, Ritchey Comp 4-Axis, Mt Zoom Ultralight)."
    - "Adjustable-angle stems (e.g., Ritchey 4-Axis Adjustable, +/-55 deg) exist in 90-120 mm but are excluded from fixed-angle lists below."

